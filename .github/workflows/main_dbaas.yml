name: Build and deploy Node.js app to Azure Web App - dbaas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Verify build output exists
        run: |
          ls -la ./frontend/dist
          test -f ./frontend/dist/index.html

      - name: Add deploy probe file
        run: |
          echo "sha=${GITHUB_SHA}" > ./frontend/dist/__deploy_probe.txt
          echo "run_id=${GITHUB_RUN_ID}" >> ./frontend/dist/__deploy_probe.txt
          cat ./frontend/dist/__deploy_probe.txt

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dbaas'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./frontend/dist
          slot-name: 'production'

      - name: Verify live URL serves deployed content
        run: |
          curl -fsSL https://dbaas.azurewebsites.net/__deploy_probe.txt -o /tmp/deploy_probe.txt
          cat /tmp/deploy_probe.txt
          grep -q "sha=${GITHUB_SHA}" /tmp/deploy_probe.txt

      - name: Fail if default Azure placeholder is still served
        run: |
          curl -fsSL https://dbaas.azurewebsites.net/ -o /tmp/homepage.html
          if grep -qi "Your web app is running and waiting for your content" /tmp/homepage.html; then
            echo "Azure is still serving the default placeholder page."
            echo "Set a Linux startup command to serve static files, then redeploy."
            exit 1
          fi
