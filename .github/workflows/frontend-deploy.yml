name: Deploy Frontend to Nginx EC2

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Upload build to S3
        run: |
          aws s3 sync ./frontend/dist s3://loonaris-frontend-12345 --delete

      # Nginx serves static files from the local filesystem (/var/www/frontend).
      # S3 is only a build artifact store. We must sync the new build down to
      # the EC2 and reload Nginx so it picks up the changes.
      # This is faster and cheaper than proxying every user request to S3.
      - name: Sync from S3 to EC2 & reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            # Write target is root-owned (/var/www); use sudo. Explicit region so
            # the sync never silently no-ops. set -e ensures a failed sync fails
            # the step instead of being masked by the nginx reload that follows.
            sudo aws s3 sync s3://loonaris-frontend-12345 /var/www/frontend --delete --region eu-west-3
            sudo nginx -s reload
            echo "frontend synced to EC2 and nginx reloaded"

      - name: Verify frontend is live
        run: |
          HTML=$(curl -fsSL --retry 5 --retry-delay 5 https://loonaris.tech/)
          echo "$HTML" | grep -q 'index-' && echo "✓ Frontend HTML is live" || { echo "::error::index.html missing build reference"; exit 1; }
          JS_FILE=$(echo "$HTML" | grep -oP '/assets/index-[^"]+\.js' | head -1)
          CSS_FILE=$(echo "$HTML" | grep -oP '/assets/index-[^"]+\.css' | head -1)
          if [ -n "$JS_FILE" ]; then
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://loonaris.tech${JS_FILE}")
            if [ "$HTTP_CODE" != "200" ] || [ "$(curl -sL "https://loonaris.tech${JS_FILE}" | head -1)" = "<!doctype" ]; then
              echo "::error::JS asset $JS_FILE returned HTML instead of JS (HTTP $HTTP_CODE)"
              exit 1
            fi
            echo "✓ JS asset $JS_FILE served correctly"
          else
            echo "::warning::Could not find JS asset reference in HTML"
          fi
          if [ -n "$CSS_FILE" ]; then
            HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://loonaris.tech${CSS_FILE}")
            [ "$HTTP_CODE" = "200" ] && echo "✓ CSS asset $CSS_FILE served correctly" || echo "::warning::CSS asset returned HTTP $HTTP_CODE"
          fi

      - name: Verify API proxy is healthy
        run: |
          RESPONSE=$(curl -fsSL --retry 5 --retry-delay 5 \
            https://loonaris.tech/api/health)
          echo "Response: $RESPONSE"
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Health check failed: status='$STATUS'"
            exit 1
          fi
          echo "✓ API proxy healthy"
