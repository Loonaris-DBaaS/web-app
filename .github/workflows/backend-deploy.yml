name: Backend Deploy to ECS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ahmed-aws/loonaris
          IMAGE_TAG: latest
        run: |
          echo "Building image…"
          docker build --provenance=false -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          echo "Pushing image…"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Force new ECS deployment
        run: |
          echo "Triggering ECS force-new-deployment…"
          aws ecs update-service \
            --cluster loonaris-ecs-fargate-cluster \
            --service loonaris-backend-service-p839kjg4 \
            --force-new-deployment \
            --region ${{ vars.AWS_REGION }}

      - name: Wait for ECS deployment to stabilize
        run: |
          echo "Waiting for ECS service to reach steady state…"
          aws ecs wait services-stable \
            --cluster loonaris-ecs-fargate-cluster \
            --services loonaris-backend-service-p839kjg4 \
            --region ${{ vars.AWS_REGION }}
          echo "Deployment stable."

      - name: Verify health endpoint
        run: |
          echo "Checking /api/health…"
          curl -fsSL --retry 5 --retry-delay 10 \
            http://loonaris-alb-1830888004.eu-west-3.elb.amazonaws.com/api/health \
            -o /tmp/health.json
          cat /tmp/health.json
