limit_req_zone $binary_remote_addr zone=all:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    server_name loonaris.tech www.loonaris.tech;

    root /var/www/frontend;
    index index.html;

    limit_req zone=all burst=30 nodelay;
    limit_conn conn 20;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/docs {
        allow 197.3.154.210;
        deny all;

        proxy_pass http://loonaris-alb-1830888004.eu-west-3.elb.amazonaws.com;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://loonaris-alb-1830888004.eu-west-3.elb.amazonaws.com;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/loonaris.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loonaris.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.loonaris.tech) {
        return 301 https://$host$request_uri;
    }

    if ($host = loonaris.tech) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name loonaris.tech www.loonaris.tech;
    return 404;
}
